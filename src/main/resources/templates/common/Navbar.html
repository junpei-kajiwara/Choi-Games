<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	</head>
	<body>
		<!-- ナビバー -->
		<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top" th:fragment="navbar(menuType)">
			<div class="container-fluid">
				
				<!-- 左側タイトル -->
				<h1 class="navbar-brand">
					Choi Games
				</h1>
				
				<!-- スマホ用メニューボタン -->
				<button class="navbar-toggler"
								type="button"
								data-bs-toggle="collapse"
								data-bs-target="#navbarMenu"
								aria-controls="navbarMenu"
								aria-expanded="false"
								aria-label="メニューを開く">
					<span class="navbar-toggler-icon"></span>
				</button>

				<!-- ナビゲーションメニュー -->
				<div class="collapse navbar-collapse" id="navbarMenu" th:if="${menuType != 'login'}">
					
					<!-- 中央メニュー -->
					<ul class="navbar-nav mx-auto">
						<li class="nav-item">
							<a class="nav-link active" href="#">ホーム</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="#">スコア</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="#">ツイート</a>
						</li>
					</ul>

					<!-- 右側メニュー -->
					<ul class="navbar-nav">
						<li class="nav-item">
							<a class="nav-link" href="#">プロフィール</a>
						</li>
						<li class="nav-item">
							<form th:action="@{/logout}" method="post">
								<button type="submit" class="nav-link border-0 bg-transparent">
										ログアウト
								</button>
							</form>
						</li>
					</ul>
				</div>
			</div>
		</nav>
	</body>
</html>
