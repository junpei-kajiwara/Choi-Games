<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/Menu.css}">
</head>
<body>
  <!-- ナビバー -->
  <div th:replace="~{common/Navbar :: navbar}"></div>

  <main class="container">
    <div th:if="${session.userData}">
      <h2>ようこそ、<span th:text="${session.userData.userName}"></span>さん！</h2>
    </div>
    
    <!-- ゲーム一覧 -->

    <!-- フォーム -->
    <form th:action="@{/games/flipCards}" method="get" id="flipCardsForm" th:object="${userForm}"></form>
    <form th:action="@{/games/swapPuzzle}" method="get" id="swapPuzzleForm" th:object="${userForm}"></form>
    <form th:action="@{/games/carryIt}" method="get" id="carryItForm" th:object="${userForm}"></form>

    <!-- アイコン -->
    <section class="gallery" id="gallery">
      <div class="gallery-item">
        <img th:src="@{/img/flipCards.jpg}" alt="flipCards" onclick="document.getElementById('flipCardsForm').submit()">
      </div>

      <div class="gallery-item">
        <img th:src="@{/img/swapPuzzle.jpg}" alt="swapPuzzle" onclick="document.getElementById('swapPuzzleForm').submit()">
      </div>

      <div class="gallery-item">
        <img th:src="@{/img/carryIt.jpg}" alt="carryIt" onclick="document.getElementById('carryItForm').submit()">
      </div>

      <div class="gallery-item">
        <img th:src="@{/img/TBD.jpg}" alt="coming soon" onclick="document.getElementById('TBDForm').submit()">
      </div>

      <div class="gallery-item">
        <img th:src="@{/img/TBD.jpg}" alt="coming soon" onclick="document.getElementById('TBDForm').submit()">
      </div>

      <div class="gallery-item">
        <img th:src="@{/img/TBD.jpg}" alt="coming soon" onclick="document.getElementById('TBDForm').submit()">
      </div>
    </section>
  </main>
</body>
</html>
